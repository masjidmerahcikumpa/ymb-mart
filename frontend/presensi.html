<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Presensi Kasir — YMB Mart</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #059669;
  --primary-dark: #047857;
  --primary-light: #10b981;
  --maroon: #8b1538;
  --gold: #d4af37;
  --bg-dark: #090d16;
  --card-bg: rgba(18, 24, 38, 0.85);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --danger: #ef4444;
  --warning: #f59e0b;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background-color: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(5, 150, 105, 0.22) 0%, transparent 45%),
    radial-gradient(circle at 90% 80%, rgba(139, 21, 56, 0.22) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, transparent 100%);
  color: var(--text-main);
  padding: 16px;
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

.container {
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.brand-logo-wrap {
  margin-bottom: 12px;
  display: flex;
  justify-content: center;
}

.brand-logo-img {
  width: 72px;
  height: 72px;
  object-fit: contain;
  background: #ffffff;
  border-radius: 50%;
  padding: 4px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 20px rgba(212, 175, 55, 0.25);
  border: 2px solid rgba(212, 175, 55, 0.5);
  display: block;
}

.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(212, 175, 55, 0.25);
  padding: 6px 16px;
  border-radius: 999px;
  backdrop-filter: blur(8px);
}

.logo-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}

.main-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 30px rgba(5, 150, 105, 0.08);
  backdrop-filter: blur(16px);
}

.clock-panel {
  text-align: center;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 20px;
}

.clock-time {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #34d399;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.clock-date {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 4px;
}

.type-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  background: rgba(0, 0, 0, 0.4);
  padding: 5px;
  border-radius: 14px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.type-btn {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
  color: var(--text-muted);
  background: transparent;
}

.type-btn.active.masuk {
  background: #059669;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
}

.type-btn.active.pulang {
  background: #d97706;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.input-wrap {
  position: relative;
}

.form-input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: all 0.2s;
}

.form-input:focus {
  border-color: #34d399;
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
}

.pin-input {
  letter-spacing: 4px;
  font-size: 18px;
  font-weight: 700;
}

.toggle-pwd {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  padding: 4px;
}

.btn-submit {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 800;
  color: #ffffff;
  background: linear-gradient(135deg, #059669, #047857);
  box-shadow: 0 8px 20px rgba(5, 150, 105, 0.35);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 20px;
}

.btn-submit.pulang-mode {
  background: linear-gradient(135deg, #d97706, #b45309);
  box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
}

.btn-submit:active {
  transform: scale(0.98);
}

.btn-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.alert-box {
  display: none;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  line-height: 1.4;
}

.alert-box.error {
  display: block;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: #fca5a5;
}

.alert-box.success {
  display: block;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #6ee7b7;
}

/* Success Card */
.success-card {
  display: none;
  text-align: center;
  padding: 10px 0;
}

.success-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(16, 185, 129, 0.15);
  border: 2px solid #10b981;
  color: #10b981;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin: 0 auto 16px;
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.success-title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 6px;
}

.success-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.receipt-box {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 16px;
  text-align: left;
  margin-bottom: 20px;
}

.receipt-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
}

.receipt-row:last-child {
  border-bottom: none;
}

.receipt-label {
  color: var(--text-muted);
}

.receipt-val {
  font-weight: 700;
  color: #fff;
}

.badge-pill {
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.badge-masuk {
  background: rgba(16, 185, 129, 0.2);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.4);
}

.badge-pulang {
  background: rgba(217, 119, 6, 0.2);
  color: #fbbf24;
  border: 1px solid rgba(217, 119, 6, 0.4);
}

.btn-secondary {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
}

.footer-text {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand-logo-wrap">
      <img src="/logo.png" alt="Logo YMB Mart" class="brand-logo-img">
    </div>
    <div class="logo-badge">
      <span class="logo-title">YMB MART &bull; PRESENSI KASIR</span>
    </div>
  </div>

  <div class="main-card">
    <div class="clock-panel">
      <div class="clock-time" id="clock-time">00:00:00</div>
      <div class="clock-date" id="clock-date">Memuat waktu...</div>
    </div>

    <!-- Alert / Toast -->
    <div class="alert-box" id="alert-box"></div>

    <!-- Form Section -->
    <div id="form-section">
      <div class="type-toggle">
        <button type="button" class="type-btn masuk active" id="btn-type-masuk" onclick="setType('masuk')">
          ☀️ Masuk
        </button>
        <button type="button" class="type-btn pulang" id="btn-type-pulang" onclick="setType('pulang')">
          🌙 Pulang
        </button>
      </div>

      <form id="presensi-form" onsubmit="submitPresensi(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username / ID Kasir</label>
          <input type="text" id="username" class="form-input" placeholder="Contoh: kasir1" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="pin">PIN Kasir (6 Angka)</label>
          <div class="input-wrap">
            <input type="password" id="pin" class="form-input pin-input" placeholder="••••••" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="current-password">
            <button type="button" class="toggle-pwd" onclick="togglePinVisibility()">LIHAT</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="notes">Catatan (Opsional)</label>
          <input type="text" id="notes" class="form-input" placeholder="Contoh: Shift Pagi / Tukar Shift">
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span id="btn-label">Catat Presensi Masuk</span>
        </button>
      </form>
    </div>

    <!-- Success Section -->
    <div class="success-card" id="success-section">
      <div class="success-icon">✓</div>
      <h2 class="success-title">Presensi Berhasil!</h2>
      <p class="success-desc">Data kehadiran Anda telah tercatat ke dalam sistem.</p>

      <div class="receipt-box">
        <div class="receipt-row">
          <span class="receipt-label">Nama Kasir</span>
          <span class="receipt-val" id="res-name">-</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Username</span>
          <span class="receipt-val" id="res-username">-</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Jenis Presensi</span>
          <span class="receipt-val"><span id="res-type" class="badge-pill badge-masuk">MASUK</span></span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Tanggal</span>
          <span class="receipt-val" id="res-date">-</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Waktu</span>
          <span class="receipt-val" id="res-time">-</span>
        </div>
      </div>

      <button type="button" class="btn-secondary" onclick="resetForm()">Presensi Lagi</button>
    </div>
  </div>

  <div class="footer-text">
    Sistem Absensi Mandiri Kasir — YMB Mart POS &copy; 2026
  </div>
</div>

<script>
let currentType = 'masuk';

// Clock update
function updateClock() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');
  const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('clock-time').textContent = timeStr;
  document.getElementById('clock-date').textContent = dateStr;
}
setInterval(updateClock, 1000);
updateClock();

// Read query params ?type=masuk or ?type=pulang
function initFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const typeParam = (params.get('type') || '').toLowerCase();
  if (typeParam === 'pulang') {
    setType('pulang');
  } else {
    setType('masuk');
  }
}

function setType(type) {
  currentType = type;
  const btnMasuk = document.getElementById('btn-type-masuk');
  const btnPulang = document.getElementById('btn-type-pulang');
  const submitBtn = document.getElementById('submit-btn');
  const btnLabel = document.getElementById('btn-label');

  if (type === 'masuk') {
    btnMasuk.classList.add('active');
    btnPulang.classList.remove('active');
    submitBtn.classList.remove('pulang-mode');
    btnLabel.textContent = 'Catat Presensi Masuk';
  } else {
    btnPulang.classList.add('active');
    btnMasuk.classList.remove('active');
    submitBtn.classList.add('pulang-mode');
    btnLabel.textContent = 'Catat Presensi Pulang';
  }
}

function togglePinVisibility() {
  const pinInput = document.getElementById('pin');
  const toggleBtn = document.querySelector('.toggle-pwd');
  if (pinInput.type === 'password') {
    pinInput.type = 'text';
    toggleBtn.textContent = 'SEMBUNYIKAN';
  } else {
    pinInput.type = 'password';
    toggleBtn.textContent = 'LIHAT';
  }
}

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alert-box');
  box.className = 'alert-box ' + type;
  box.textContent = msg;
}

function hideAlert() {
  const box = document.getElementById('alert-box');
  box.className = 'alert-box';
  box.textContent = '';
}

async function submitPresensi(e) {
  e.preventDefault();
  hideAlert();

  const username = document.getElementById('username').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const submitBtn = document.getElementById('submit-btn');
  const btnLabel = document.getElementById('btn-label');

  if (!username) {
    showAlert('Silakan masukkan Username / ID Kasir');
    return;
  }
  if (!pin || pin.length !== 6 || !/^\d{6}$/.test(pin)) {
    showAlert('PIN kasir harus berupa 6 angka');
    return;
  }

  submitBtn.disabled = true;
  btnLabel.textContent = 'Menyimpan...';

  const deviceInfo = navigator.userAgent + ' | ' + window.screen.width + 'x' + window.screen.height;

  try {
    const res = await fetch('/api/presensi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username,
        pin: pin,
        type: currentType,
        notes: notes,
        device_info: deviceInfo
      })
    });

    const data = await res.json();
    if (!res.ok || data.status === 'error') {
      showAlert(data.message || 'Gagal melakukan presensi. Periksa kembali ID dan PIN Anda.');
      submitBtn.disabled = false;
      setType(currentType);
      return;
    }

    // Show Success State
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-section').style.display = 'block';

    document.getElementById('res-name').textContent = data.cashier_name || data.username;
    document.getElementById('res-username').textContent = data.username;
    document.getElementById('res-date').textContent = data.date;
    document.getElementById('res-time').textContent = data.time + ' WIB';

    const typeBadge = document.getElementById('res-type');
    if (data.type === 'pulang') {
      typeBadge.textContent = 'PULANG';
      typeBadge.className = 'badge-pill badge-pulang';
    } else {
      typeBadge.textContent = 'MASUK';
      typeBadge.className = 'badge-pill badge-masuk';
    }

  } catch (err) {
    console.error(err);
    showAlert('Terjadi kesalahan koneksi ke server. Pastikan Anda terhubung ke jaringan kasir.');
    submitBtn.disabled = false;
    setType(currentType);
  }
}

function resetForm() {
  document.getElementById('pin').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('success-section').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
  setType(currentType);
  hideAlert();
}

window.addEventListener('DOMContentLoaded', initFromQuery);
</script>
</body>
</html>
